<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff7e0">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Exercice de formation : écrans de triage d'un dossier informatisé, patients fictifs. Ce n'est pas le système CURY.">
<meta property="og:title" content="Exercice de triage – EMR (données fictives)">
<meta property="og:description" content="Exercice de formation avec des patients fictifs. Ce n'est pas le système CURY.">
<title>Exercice de triage – EMR (données fictives)</title>
<style>
:root{
  --primary:#4c6ef5;--primary-h:#3d5ee0;--primary-l:#e5eafe;
  --success:#71dd37;--success-t:#3f8f17;--success-l:#e8fadf;
  --info:#03c3ec;--info-t:#0381a0;--info-l:#d7f5fc;
  --warning:#ffab00;--warning-t:#a86f00;--warning-l:#fff2d6;
  --danger:#ff3e1d;--danger-t:#d22c0e;--danger-l:#ffe0db;
  --body:#5d6b79;--heading:#3a4754;--muted:#97a3b0;
  --bg:#f5f5f9;--card:#fff;--border:#d9dee3;--shadow:0 2px 6px rgba(67,89,113,.12);
  --train-bg:#fff7e0;--train-bd:#e8c46a;--train-t:#5c4300;--train-strong:#8a5a00;
  --tbh:44px;
  --font:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);font-size:15px;line-height:1.47;color:var(--body);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4,h5,h6{color:var(--heading);margin:0;font-weight:500}
.muted{color:var(--muted)}
svg.ic{width:20px;height:20px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
svg.icf{fill:currentColor;stroke:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* bande d'exercice */
#trainbar{position:sticky;top:0;z-index:70;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:6px 14px;background:var(--train-bg);border-bottom:2px solid var(--train-bd);color:var(--train-t);font-size:13.5px}
.tb-tag{display:inline-block;background:var(--train-strong);color:#fff;font-weight:700;font-size:12px;letter-spacing:.08em;padding:2px 8px;border-radius:4px;white-space:nowrap}
.tb-case{font-weight:600}
.tb-sp{flex:1}
.tbtn{border:1px solid var(--train-bd);background:#fff;color:var(--train-t);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:13.5px;line-height:1.35}
.tbtn:hover{background:#fff1c7}
.tbtn.on{background:var(--train-strong);border-color:var(--train-strong);color:#fff}
.tb-lang{display:inline-flex}
.tb-lang .tbtn:first-child{border-radius:6px 0 0 6px}
.tb-lang .tbtn:last-child{border-radius:0 6px 6px 0;margin-left:-1px}

/* mise en page */
#layout{display:flex;align-items:flex-start}
#menu{width:260px;flex:0 0 260px;background:#fff;box-shadow:0 0 0 1px rgba(67,89,113,.05),0 2px 6px rgba(67,89,113,.12);position:sticky;top:var(--tbh);height:calc(100vh - var(--tbh));overflow-y:auto;z-index:30}
#page{flex:1 1 auto;min-width:0;padding:0 24px;min-height:calc(100vh - var(--tbh));display:flex;flex-direction:column}
#content{flex:1 0 auto;padding:4px 0 20px}
#footer{padding:12px 0 18px;font-size:14px;color:var(--body)}
#casePanel{display:none;width:360px;flex:0 0 360px;background:#fffdf6;border-left:3px solid var(--train-bd);position:sticky;top:var(--tbh);height:calc(100vh - var(--tbh));overflow-y:auto;z-index:40}
body.case-open #casePanel{display:block}

/* menu */
.brand{display:flex;align-items:center;gap:12px;height:70px;padding:0 24px}
.logo-mini{font-weight:800;font-size:12px;color:#b0201a;border-bottom:3px solid #2848a8;line-height:1;padding-bottom:2px}
.brand-t{font-size:30px;font-weight:700;color:var(--heading)}
.menu{list-style:none;margin:6px 0 20px;padding:0 14px}
.menu li{margin:2px 0}
.menu a{display:flex;align-items:center;gap:12px;padding:9px 14px;border-radius:6px;color:var(--heading);cursor:pointer;text-decoration:none}
.menu a:hover{background:#f2f3f5}
.menu .chev svg.ic{width:16px;height:16px}
.menu .chev{margin-left:auto;display:inline-flex;color:var(--muted)}
.menu li.active > a{background:var(--primary-l);color:var(--primary)}
.menu .sub{list-style:none;margin:2px 0 6px;padding:0}
.menu .sub a{padding:8px 14px 8px 46px;position:relative}
.menu .sub a::before{content:'';position:absolute;left:25px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:#b4bdc6}
.menu .sub a.active{font-weight:600}
.menu .sub a.active::before{background:var(--primary);box-shadow:0 0 0 3px var(--primary-l);width:8px;height:8px;margin-top:-4px;left:24px}

/* barre du haut */
#navbar{margin:14px 0 10px;min-height:62px;background:#fff;border-radius:8px;box-shadow:var(--shadow);display:flex;align-items:center;padding:0 16px;gap:12px;position:relative;z-index:25}
.nb-burger{display:none;border:0;background:none;padding:6px;cursor:pointer;color:var(--heading)}
.nb-search{position:relative;flex:1;display:flex;align-items:center;gap:8px;min-width:0;color:var(--heading)}
.nb-search input{border:0;outline:0;background:transparent;width:100%;font-size:15.5px;color:var(--heading);padding:8px 0}
.nb-search input::placeholder{color:#97a3b0}
.nb-icons{display:flex;align-items:center;gap:12px;position:relative}
.nb-ic{border:0;background:none;padding:4px;cursor:pointer;color:var(--heading);display:inline-flex}
.nb-ic svg.ic{width:23px;height:23px}
.avatar{position:relative;border:0;background:none;padding:0;cursor:pointer;width:40px;height:40px;display:inline-flex}
.avatar svg{width:40px;height:40px}
.avatar .dot{position:absolute;right:1px;bottom:1px;width:10px;height:10px;border-radius:50%;background:var(--success);box-shadow:0 0 0 2px #fff}
.dropdown{position:absolute;right:0;top:calc(100% + 10px);background:#fff;border-radius:8px;box-shadow:0 6px 18px rgba(67,89,113,.22);min-width:250px;padding:8px 0;z-index:60}
.dropdown[hidden]{display:none}
.dd-item{display:flex;align-items:center;gap:10px;padding:9px 18px;cursor:pointer;color:var(--heading);border:0;background:none;width:100%;text-align:left}
.dd-item:hover{background:#f2f3f5}
.dd-head{padding:6px 18px 10px;border-bottom:1px solid var(--border);margin-bottom:6px}
.dd-head b{display:block;color:var(--heading)}
.dd-head small{color:var(--body)}
.nb-drop{position:absolute;left:0;right:0;top:calc(100% + 12px);background:#fff;border-radius:8px;box-shadow:0 6px 18px rgba(67,89,113,.22);z-index:60;max-height:300px;overflow:auto}
.nb-drop[hidden]{display:none}
.nb-drop div{padding:9px 16px;cursor:pointer;color:var(--heading)}
.nb-drop div:hover{background:#f2f3f5}
.nb-drop .msg{cursor:default;color:var(--body)}

/* titres de page */
.pg-head{display:flex;align-items:center;gap:12px;margin:8px 0 16px;flex-wrap:wrap}
.bc{font-size:1.45rem;font-weight:500;color:var(--heading)}
.bc .muted{font-weight:400}
.pg-head .sp{flex:1}

/* boutons */
.btn{border:0;border-radius:6px;padding:9px 18px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1.3;font-size:15px;text-decoration:none}
.btn svg.ic{width:18px;height:18px}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 2px 4px rgba(76,110,245,.35)}
.btn-primary:hover{background:var(--primary-h)}
.btn-info{background:var(--info);color:#fff;box-shadow:0 2px 4px rgba(3,195,236,.35)}
.btn-warning{background:var(--warning);color:#fff;box-shadow:0 2px 4px rgba(255,171,0,.35)}
.btn-success{background:var(--success);color:#fff;box-shadow:0 2px 4px rgba(113,221,55,.35)}
.btn-outline{background:#fff;border:1px solid var(--border);color:var(--body)}
.btn-lab{background:#eceef1;color:#697a8d}
.btn[disabled]{background:#eceef1;color:#a1acb8;box-shadow:none;cursor:default}
.btn-group{display:inline-flex}
.btn-group .btn{border-radius:0}
.btn-group .btn:first-child{border-radius:6px 0 0 6px}
.btn-group .btn:last-child{border-radius:0 6px 6px 0}

/* cartes et alertes */
.card{background:var(--card);border-radius:8px;box-shadow:var(--shadow);margin-bottom:20px}
.alert-info{display:flex;gap:12px;align-items:flex-start;background:var(--info-l);color:#0a86a7;border-radius:8px;padding:12px 16px;margin-bottom:20px;font-size:14.5px}
.alert-info b{color:#07708c}
.alert-info .ic{margin-top:1px}
.badge{display:inline-block;font-size:12px;font-weight:600;line-height:1;padding:5px 8px;border-radius:4px;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap}
.bl-success{background:var(--success-l);color:var(--success-t)}
.bl-danger{background:var(--danger-l);color:var(--danger-t)}
.bl-warning{background:var(--warning-l);color:var(--warning-t)}
.bl-info{background:var(--info-l);color:var(--info-t)}
.train-note{background:var(--train-bg);border:1px solid var(--train-bd);color:var(--train-t);border-radius:6px;padding:8px 12px;font-size:14px;margin-top:10px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;line-height:1.4}
.train-note .tb-tag{font-size:11px;padding:2px 6px}
.train-note.wide{margin:0 0 18px}
.linkbtn{border:0;background:none;padding:0;color:var(--train-strong);text-decoration:underline;cursor:pointer;font-weight:600;font-size:inherit}
.s2-list li.s2-train{background:var(--train-bg);color:var(--train-t);border-top:1px solid var(--train-bd);cursor:default}
.reg-ok{background:var(--success-l);color:var(--success-t);border-radius:8px;padding:14px 16px;margin-bottom:20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.reg-ok .sp{flex:1}
.reg-err{color:var(--danger-t);font-size:14px;margin-top:2px}
.resume-note{background:var(--primary-l);color:var(--primary-h);border-radius:6px;padding:8px 14px;margin:0 0 14px;font-size:14.5px}

/* assistant (wizard) */
.wz-head{display:flex;align-items:center;flex-wrap:wrap;gap:6px 2px;padding:18px 20px;border-bottom:1px solid var(--border)}
.step{display:flex;align-items:center;gap:12px;border:0;background:none;cursor:pointer;padding:4px 6px;text-align:left;border-radius:6px}
.step-n{width:40px;height:40px;flex:0 0 40px;border-radius:6px;background:#eceef1;color:#8592a3;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:500}
.step-t{display:block;color:var(--heading);font-weight:500;font-size:15.5px;line-height:1.2}
.step-s{display:block;color:var(--muted);font-size:13.5px;line-height:1.3}
.step.act .step-n{background:var(--primary);color:#fff;box-shadow:0 2px 5px rgba(76,110,245,.45)}
.step.act .step-t{color:var(--primary)}
.step.done .step-n{background:var(--primary-l);color:var(--primary)}
.wz-sep{color:var(--primary);display:inline-flex;margin:0 4px}
.wz-sep svg.ic{width:18px;height:18px}
.wz-body{padding:20px 22px 22px}
.st-head{margin-bottom:18px}
.st-head h6{font-size:16px;font-weight:500;margin:0}
.st-head small{color:var(--body);font-size:14px}
.st-nav{display:flex;align-items:center;gap:10px;margin-top:22px;flex-wrap:wrap}
.st-nav .sp{flex:1}

/* formulaires */
.lbl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;font-weight:500;color:var(--heading);text-transform:uppercase;letter-spacing:.02em;margin-bottom:6px;min-height:20px}
.fld{margin-bottom:16px;min-width:0}
.inp{width:100%;height:42px;border:1px solid var(--border);border-radius:6px;background:#fff;padding:0 14px;color:var(--heading);font-size:15px;outline:0}
.inp:focus{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-l)}
.inp::placeholder{color:#b4bdc6}
.inp.calc{background:#eceef1}
.inp.sm{width:auto;height:38px;padding:0 10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 26px}
.grid3.al > .fld{display:flex;flex-direction:column;justify-content:flex-end}
.sec{font-size:17px;font-weight:500;margin:24px 0 12px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.sec.first{margin-top:4px}

/* listes déroulantes */
.s2-wrap{position:relative}
.s2{min-height:42px;border:1px solid var(--border);border-radius:6px;background:#fff;display:flex;align-items:center;cursor:pointer;padding:0 10px 0 14px;gap:6px;outline:0}
.s2:focus,.s2.open{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-l)}
.s2-txt{flex:1;color:var(--heading);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s2-txt.ph{color:#8592a3}
.s2-x{color:#8592a3;font-size:17px;padding:0 4px;line-height:1}
.s2-arr{display:inline-flex;color:#8592a3}
.s2-arr svg.ic{width:18px;height:18px}
.s2-m{padding:4px 8px;cursor:text}
.s2-chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:5px;width:100%}
.s2-chip{background:#eceef1;color:var(--heading);border-radius:4px;padding:3px 8px 3px 6px;font-size:13.5px;display:inline-flex;gap:6px;align-items:flex-start;max-width:100%;line-height:1.35}
.s2-chip-x{cursor:pointer;color:#8592a3;font-weight:700}
.s2-in{flex:1;min-width:60px}
.s2-in input{border:0;outline:0;width:100%;height:30px;background:transparent}
.s2-drop{position:absolute;left:0;right:0;top:calc(100% + 2px);background:#fff;border:1px solid var(--border);border-radius:6px;box-shadow:0 6px 16px rgba(67,89,113,.22);z-index:80}
.s2-drop[hidden]{display:none}
.s2-drop.up{top:auto;bottom:calc(100% + 2px)}
.s2-sbox{padding:8px}
.s2-sbox input{width:100%;height:36px;border:1px solid var(--border);border-radius:5px;padding:0 10px;outline:0}
.s2-list{list-style:none;margin:0;padding:4px 0;max-height:262px;overflow-y:auto}
.s2-list li{padding:8px 16px;cursor:pointer;color:var(--heading);line-height:1.4}
.s2-list li.ph{color:#8592a3}
.s2-list li.sel{background:#eceef1}
.s2-list li.hi,.s2-list li:hover{background:var(--primary-l);color:var(--primary)}
.s2-list li.s2-msg{cursor:default;color:var(--body);background:none}

/* EVDA */
.evda{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 20px;margin-bottom:6px}
.evd{display:flex;align-items:center;gap:10px;cursor:pointer;color:var(--heading);position:relative}
.evd input{position:absolute;opacity:0;width:1px;height:1px}
.evd-sw{position:relative;width:46px;height:24px;border-radius:12px;background:#eceef1;border:1px solid #d0d5db;flex:0 0 46px}
.evd-sw::after{content:'×';position:absolute;left:2px;top:2px;width:18px;height:18px;border-radius:4px;background:#8592a3;color:#fff;font-size:13px;line-height:18px;text-align:center}
.evd input:checked + .evd-sw{background:var(--primary);border-color:var(--primary)}
.evd input:checked + .evd-sw::after{content:'✓';left:24px;background:#fff;color:var(--primary)}
.evd input:focus-visible + .evd-sw{box-shadow:0 0 0 3px var(--primary-l)}
.gcs-pic{height:104px;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.gcs-pic svg{height:92px;width:auto;stroke:#3b3b3b;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}

/* étape 1 */
.st1-code{max-width:840px;margin:0 auto 26px}
.st1-det{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
.st1-av{text-align:center;padding-top:6px}
.st1-av svg{width:140px;height:140px}
.st1-av h3{font-size:24px;font-weight:500;margin-top:12px}
.det h5{font-size:19px;font-weight:500;padding-bottom:10px;border-bottom:1px solid var(--border);margin-bottom:14px}
.det p{margin:0 0 13px;color:var(--heading)}
.det p span{color:var(--body);margin-left:6px}

/* tableaux */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--heading);text-align:left;padding:14px 18px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:12px 18px;border-bottom:1px solid var(--border);vertical-align:middle;color:var(--heading)}
.urine{margin-top:22px}
.urine td:first-child{width:45%}

/* résumé */
.sum{max-width:1000px;margin:0 auto}
.sum-t{font-size:21px;font-weight:600;color:var(--heading);margin:4px 0 8px}
.sum-bar{height:9px;margin-bottom:22px}
.sum-cols{display:grid;grid-template-columns:1fr 1fr}
.sum-l{padding-right:26px;border-right:2px dashed #4a4a4a}
.sum-r{padding-left:26px}
.sum-row{margin:0 0 15px;color:var(--heading)}
.sum-row .k{margin-right:10px}
.sum-row b{font-weight:600}
.sum-act{text-align:center;font-size:22px;font-weight:600;margin:22px 0 4px}
.c-danger{color:var(--danger-t)}.c-warning{color:var(--warning-t)}.c-success{color:var(--success-t)}
.bg-danger{background:var(--danger)}.bg-warning{background:var(--warning)}.bg-success{background:var(--success)}

/* liste des triages */
.flt{display:flex;flex-wrap:wrap;gap:14px 18px;align-items:flex-end;padding:20px 22px}
.flt > div{flex:1 1 170px}
.tbl-list{font-size:14.5px}
.tbl-list th{white-space:normal;letter-spacing:.5px;padding:13px 8px}
.tbl-list td{padding:12px 8px}
.tbl-list td:nth-child(1),.tbl-list td:nth-child(2){white-space:nowrap}
.tbl-list th:first-child,.tbl-list td:first-child{padding-left:16px}
.opt{display:flex;flex-wrap:wrap;gap:6px}
.btn-sm{padding:6px 10px;font-size:14px}
.btn-sm svg.ic{width:16px;height:16px}
.sw{display:flex;align-items:center;gap:10px;cursor:pointer;color:var(--heading);min-height:42px;position:relative}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw-ui{width:38px;height:22px;border-radius:11px;background:#e2e5e9;position:relative;flex:0 0 38px}
.sw-ui::after{content:'';position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw input:checked + .sw-ui{background:var(--primary)}
.sw input:checked + .sw-ui::after{left:19px}
.sw input:focus-visible + .sw-ui{box-shadow:0 0 0 3px var(--primary-l)}
.tbl-top{display:flex;align-items:center;gap:12px;padding:18px 22px;flex-wrap:wrap}
.tbl-top .sp{flex:1}
.tbl-top label{display:flex;align-items:center;gap:8px;color:var(--heading)}
.tbl-wrap{overflow-x:auto}
.tbl-foot{padding:14px 22px;color:var(--body);font-size:14px}
.hist{display:inline-flex;align-items:center;gap:5px;color:var(--primary);cursor:pointer;font-size:14.5px;border:0;background:none;padding:0}
.hist svg.ic{width:16px;height:16px}
.started{display:flex;gap:5px;align-items:flex-start;color:var(--body);font-size:13.5px;text-transform:uppercase;margin-top:3px}
.started svg.ic{width:16px;height:16px;margin-top:1px}
.hist-box{font-size:13px;color:var(--body);margin-top:4px}
.pr-cell .badge{display:block;width:max-content;margin:3px 0}
.stat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:20px}
.stat{padding:18px 20px}
.stat b{display:block;font-size:30px;color:var(--heading);font-weight:600}

/* fiche du cas */
.cp-head{position:sticky;top:0;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--train-bg);border-bottom:1px solid var(--train-bd);color:var(--train-t);z-index:2}
.cp-head b{flex:1}
.cp-x{border:0;background:none;cursor:pointer;color:var(--train-t);display:inline-flex;padding:4px}
.cp-body{padding:14px 16px 24px;color:#3d3a30;font-size:14.5px}
.cp-title{font-size:19px;margin:0 0 4px;color:#3d3a30;font-weight:600}
.cp-pat{font-weight:600;margin-bottom:8px}
.cp-story{margin:0 0 12px;line-height:1.5}
.cp-h{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--train-strong);margin:14px 0 6px;font-weight:700}
.cp-tbl{width:100%;border-collapse:collapse;font-size:14px}
.cp-tbl th{text-align:left;font-weight:500;color:#6b5a2e;padding:5px 8px 5px 0;vertical-align:top;width:44%}
.cp-tbl td{padding:5px 0;vertical-align:top;font-weight:600;color:#3d3a30}

.start-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:12px 0 6px}
.case-btn{border:1px solid var(--border);background:#fff;border-radius:8px;padding:14px 16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px}

.small{font-size:13.5px;color:var(--body)}
.msg-box{background:#eef7e9;border-left:4px solid var(--success-t);padding:10px 12px;border-radius:4px;margin-bottom:14px;color:#2f5d1a}

/* correction */
.res-top{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;margin-bottom:12px}

/* guide */

/* messages */

    else if (c === 'RY') R.push({c:(age < 12 ? 'R' : 'Y'), fr:tf, en:te});

    else if (c === 'G2') g2.push(s.text);

  else if (g1.indexOf('Altération de la conscience') >= 0) R.push({c:'Y', fr:'DEFICIT NEUROLOGIQUE : Altération de la conscience (seule : jaune)', en:'NEUROLOGICAL DEFICIT: Altered mental status (alone: yellow)'});

  if (d.cyanose === 'Oui') R.push({c:'R', fr:'CYANOSE CENTRALE : Oui', en:'CENTRAL CYANOSIS: Yes'});
  if ((d.evda || []).indexOf('A') >= 0) R.push({c:'R', fr:'EVDA : Absence de réponse', en:'AVPU: Unresponsive'});
  var trc = parseNum(d.trc), fc = parseNum(d.fc);

  if (fc !== null && !isNaN(fc) && fc > 0 && (fc < 50 || fc > 150)) R.push({c:'R', fr:'FC < 50 ou > 150', en:'Heart rate < 50 or > 150'});
  var level = R.some(function(x){ return x.c === 'R'; }) ? 'CRITIQUE' : (R.some(function(x){ return x.c === 'Y'; }) ? 'SEVERE' : 'MODERE');

}
function riskVitals(d){
  var out = [], fc = parseNum(d.fc), fr = parseNum(d.fr), temp = parseNum(d.temp), sao2 = parseNum(d.sao2);
  var ok = function(n){ return n !== null && !isNaN(n) && n !== 0; };
  if (ok(fc) && (fc < 60 || fc > 130)) out.push({fr:'FC ' + fc + ' (< 60 ou > 130)', en:'HR ' + fc + ' (< 60 or > 130)'});
  if (ok(fr) && (fr < 10 || fr > 30)) out.push({fr:'FR ' + fr + ' (< 10 ou > 30)', en:'RR ' + fr + ' (< 10 or > 30)'});
  if (ok(temp) && temp <= 45 && (temp < 36 || temp > 39)) out.push({fr:'T ' + String(temp).replace('.', ',') + ' °C (< 36 ou > 39)', en:'T ' + temp + ' °C (< 36 or > 39)'});
  if (ok(sao2) && sao2 < 92) out.push({fr:'SpO2 ' + sao2 + ' % (< 92 %)', en:'SpO2 ' + sao2 + ' % (< 92 %)'});
  var ev = d.evda || [];
  if (ev.length && ev.indexOf('E') < 0) out.push({fr:'EVDA différent de « Eveillé »', en:'AVPU not “Alert”'});
  return out;
}

/* ---------- correction ---------- */
function vtxt(v){ var s = String(v == null ? '' : v).trim(); return s === '' ? t('empty') : s; }
function fnum(n){ return S.lang === 'fr' ? String(n).replace('.', ',') : String(n); }
function evaluate(cid, rec){
  var C = CASES[cid], X = C.expect, d = rec.d, out = [];
  var add = function(ok, fr, en, dfr, den){ out.push({ok:ok, fr:fr, en:en, dfr:dfr || '', den:den || ''}); };
  var mf = function(a){ return a.map(function(c){ return motifTxt(c, 'fr'); }).join(' ; '); };
  var me = function(a){ return a.map(function(c){ return motifTxt(c, 'en'); }).join('; '); };
  var ej = function(a, sep){ return a.map(function(x){ return EN(x); }).join(sep); };
  var vf = function(v){ var s = String(v == null ? '' : v).trim(); return s === '' ? TXT.fr.empty : s; };
  var ve = function(v){ var s = String(v == null ? '' : v).trim(); return s === '' ? TXT.en.empty : s; };
  /* patient */
  var p = pById(d.patient), pe = pById(X.patient);
  if (d.patient === X.patient) add(true, 'Bon patient : ' + pe.name + ', ' + (pe.sex === 'F' ? 'née le ' : 'né le ') + dmyISO(pe.dob), 'Right patient: ' + pe.name + ', born ' + dmyISO(pe.dob));
  else if (p && p.name === pe.name) add(false, 'Mauvais patient (même nom)', 'Wrong patient (same name)', p.id + ' est né le ' + dmyISO(p.dob) + '. Le patient du cas est né le ' + dmyISO(pe.dob) + ' : vérifiez toujours la date de naissance dans Détails.', p.id + ' was born on ' + dmyISO(p.dob) + '. The case patient was born on ' + dmyISO(pe.dob) + ': always check the date of birth in Details.');
  else add(false, 'Mauvais patient', 'Wrong patient', p ? p.id + ' - ' + p.name : '', p ? p.id + ' - ' + p.name : '');
  /* reprise (TEST 04) */
  if (X.resume){
    if (rec.code === S.t04code) add(true, 'Triage en attente repris (pas de doublon)', 'Pending triage resumed (no duplicate)');
    else add(false, 'Nouveau triage créé au lieu de reprendre', 'New triage created instead of resuming', 'Le triage en attente reste dans la liste : il y a maintenant deux triages pour le même patient. Utilisez « Reprendre le triage ».', 'The pending triage is still in the list: there are now two triages for the same patient. Use “Resume triage”.');
  }
  /* motifs */
  var miss = X.motifs.filter(function(c){ return d.motifs.indexOf(c) < 0; });
  var extra = d.motifs.filter(function(c){ return X.motifs.indexOf(c) < 0 && X.motifsOpt.indexOf(c) < 0; });
  if (!d.motifs.length) add(false, 'Aucun motif choisi', 'No complaint chosen', 'Sans motif, le dossier ne dit pas pourquoi le patient est venu. Attendu : ' + mf(X.motifs), 'Without a complaint, the record does not say why the patient came. Expected: ' + me(X.motifs));
  else if (!miss.length && !extra.length) add(true, 'Motif(s) : ' + mf(d.motifs), 'Complaint(s): ' + me(d.motifs));
  else add(false, 'Motif(s) à revoir', 'Complaint(s) to review',
    [miss.length ? 'Manquant : ' + mf(miss) : '', extra.length ? 'En trop : ' + mf(extra) : ''].filter(Boolean).join(' — '),
    [miss.length ? 'Missing: ' + me(miss) : '', extra.length ? 'Not needed: ' + me(extra) : ''].filter(Boolean).join(' — '));
  /* signes */
  var sel = allSigns(d), age = ageOf(pe.dob), eqUsed = [];
  var has = function(sg){ return sel.some(function(x){ return x.text === sg; }); };
  var missS = X.signs.filter(function(sg){
    if (has(sg)) return false;
    for (var k in CHILD_EQ) if (CHILD_EQ[k] === sg && has(k)){ eqUsed.push(k); return false; }
    return true;
  });
  var extraS = sel.filter(function(x){ return X.signs.indexOf(x.text) < 0 && X.signsOpt.indexOf(x.text) < 0 && eqUsed.indexOf(x.text) < 0; });
  var eqFr = eqUsed.map(function(k){ return 'Accepté : « ' + k + ' » est le libellé enfant ; pour un adulte, choisissez « ' + CHILD_EQ[k] + ' ».'; }).join(' ');
  var eqEn = eqUsed.map(function(k){ return 'Accepted: “' + EN(k) + '” is the child label; for an adult, choose “' + EN(CHILD_EQ[k]) + '”.'; }).join(' ');
  var selTxt = sel.map(function(x){ return x.text; });
  if (!missS.length && !extraS.length){
    if (selTxt.length) add(true, 'Signes : ' + selTxt.join(' ; '), 'Signs: ' + ej(selTxt, '; '), eqFr, eqEn);
    else add(true, 'Aucun signe choisi (juste : pas de signe rouge ou jaune)', 'No sign selected (right: no red or yellow sign)');
  } else {
    var dfr = [], den = [];
    if (missS.length){ dfr.push('Manquant : ' + missS.join(' ; ') + '.'); den.push('Missing: ' + ej(missS, '; ') + '.'); }
    extraS.forEach(function(x){
      var nt = signNote(x.text, cid), ch = SIGN_INFO[x.text] && SIGN_INFO[x.text].child && age >= 12;
      dfr.push('En trop : « ' + x.text + ' » (' + x.boxLabel + '). ' + (nt ? nt.fr : (ch ? "Item pour l'enfant (moins de 12 ans)." : 'Le cas ne décrit pas ce signe.')));
      den.push('Not needed: “' + EN(x.text) + '” (' + EN(x.boxLabel) + '). ' + (nt ? nt.en : (ch ? 'Item for children (under 12).' : 'The case does not describe this sign.')));
    });
    if (eqFr){ dfr.push(eqFr); den.push(eqEn); }
    add(false, 'Signes à revoir', 'Signs to review', dfr.join(' '), den.join(' '));
  }
  /* cyanose */
  if (d.cyanose === X.cyanose) add(true, 'CYANOSE CENTRALE : ' + X.cyanose, 'CENTRAL CYANOSIS: ' + EN(X.cyanose));
  else if (!d.cyanose) add(false, 'CYANOSE CENTRALE non renseignée', 'CENTRAL CYANOSIS not filled', 'Choisir « Non » quand elle est absente.', 'Choose “No” when it is absent.');
  else add(false, 'CYANOSE CENTRALE : ' + d.cyanose, 'CENTRAL CYANOSIS: ' + EN(d.cyanose), 'Pas de cyanose décrite (lèvres et langue non bleues) → « Non ». « Oui » rend le patient critique.', 'No cyanosis described (lips and tongue not blue) → “No”. “Yes” makes the patient critical.');
  /* EVDA */
  var ev = d.evda || [];
  if (ev.length === 1 && ev[0] === 'E') add(true, 'EVDA : Eveillé', 'AVPU: Alert');
  else if (!ev.length) add(false, 'EVDA non renseigné', 'AVPU not filled', 'Activez l’interrupteur « Eveillé ».', 'Switch on “Alert”.');
  else add(false, 'EVDA à revoir', 'AVPU to review', ev.length > 1 ? 'Un seul interrupteur EVDA à la fois.' : 'Le patient est éveillé : « Eveillé ».', ev.length > 1 ? 'Only one AVPU switch at a time.' : 'The patient is awake: “Alert”.');
  /* Glasgow */
  var gv = [d.gcsE, d.gcsV, d.gcsM];
  if (gv[0] === GCS_OK[0] && gv[1] === GCS_OK[1] && gv[2] === GCS_OK[2]) add(true, 'Glasgow : ' + GCS_OK.join(' / ') + ' (15)', 'Glasgow: ' + ej(GCS_OK, ' / ') + ' (15)');
  else add(false, 'Glasgow à revoir', 'Glasgow to review', 'Saisi : ' + gv.map(function(x){ return x || TXT.fr.empty; }).join(' / ') + '. Attendu : ' + GCS_OK.join(' / ') + '.', 'Entered: ' + gv.map(function(x){ return x ? EN(x) : TXT.en.empty; }).join(' / ') + '. Expected: ' + ej(GCS_OK, ' / ') + '.');
  /* valeurs */
  var wf = [], we = [];
  Object.keys(X.values).forEach(function(k){
    var target = X.values[k], n = parseNum(d[k]);
    if (n === null || isNaN(n) || Math.abs(n - target) > 0.0001){
      var extraFr = '', extraEn = '';

  h += '<h3>' + (en ? 'Technical use' : 'Utilisation technique') + '</h3><ul class="g-list">' + (en ? ['Link (phone or computer, with internet): https://joojeong.github.io/exercise-triage/', 'File (without internet): open it in Chrome or Edge (double-click).', 'Several PCs: copy the file (USB key, WhatsApp, e-mail).', 'Projector: enlarge with Ctrl + / Ctrl −.', 'Without internet: after a first visit to the link with internet, the practice also opens without internet on the same device and browser. On iPhone, add it to the Home Screen so that it stays saved, then open it once from the icon with internet (the icon keeps its own copy).', 'Phone: the case card stays at the bottom of the screen: tap it to open or hide it.', 'iPhone: use the link. The file alone does not run in the WhatsApp or Files preview. Android: the link, or the file opened with Chrome.'] : ['Lien (téléphone ou ordinateur, avec internet) : https://joojeong.github.io/exercise-triage/', 'Fichier (sans internet) : l’ouvrir dans Chrome ou Edge (double-clic).', 'Plusieurs postes : copier le fichier (clé USB, WhatsApp, e-mail).', 'Projection : agrandir avec Ctrl + / Ctrl −.', 'Sans internet : après une première ouverture du lien avec internet, l’exercice s’ouvre aussi sans internet sur le même appareil et le même navigateur. Sur iPhone, l’ajouter à l’écran d’accueil pour qu’il reste gardé, puis l’ouvrir une fois depuis l’icône avec internet (l’icône garde sa propre copie).', 'Téléphone : la fiche du cas reste en bas de l’écran ; la toucher pour l’ouvrir ou la réduire.', 'iPhone : utiliser le lien. Le fichier seul ne marche pas dans l’aperçu de WhatsApp ou de Fichiers. Android : le lien, ou le fichier ouvert avec Chrome.']).map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
  h += '<p class="small">' + (en ? 'Version of 29/10/2026 (online, works offline after a first visit) · prepared for the CURY medical-records training (KOICA project; PMC: Seoul National University Hospital).' : 'Version du 29/10/2026 (en ligne, marche hors connexion après une première ouverture) · préparée pour la formation sur les dossiers médicaux du CURY (projet KOICA ; PMC : Seoul National University Hospital).') + '</p>';
  return h;
}
function openGuide(){
  var g = $('#guideScreen');
  g.innerHTML = '<div class="panel"><div class="panel-h"><span class="tb-tag">' + (S.lang === 'en' ? 'PRACTICE' : 'EXERCICE') + '</span><h2>' + esc(t('guideTitle')) + '</h2>' +
    '<button class="tbtn" data-g="print">' + esc(t('print')) + '</button><button class="tbtn" data-g="close">' + esc(t('close')) + '</button></div><div class="panel-b">' + guideHTML() + '</div></div>';
  g.hidden = false; g.scrollTop = 0;
}
function fillPrint(){ $('#printArea').innerHTML = '<h2>' + esc(t('guideTitle')) + ' · ' + esc(t('startTitle')) + '</h2>' + guideHTML(); }
window.addEventListener('beforeprint', function(){ if (!$('#guideScreen').hidden){ fillPrint(); document.body.classList.add('printing'); } });
window.addEventListener('afterprint', function(){ document.body.classList.remove('printing'); });

/* ---------- messages ---------- */
function toast(msg, cls){
  var box = $('#toasts'), el = document.createElement('div'); el.className = 'toast ' + (cls || ''); el.textContent = msg;
  while (box.children.length >= 2) box.removeChild(box.firstChild);
  box.appendChild(el); setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 4200);
}

/* ---------- événements ---------- */
function setLang(l){
  S.lang = l; store.set('lang', l); document.documentElement.lang = l === 'en' ? 'en' : 'fr';
  $('#toasts').innerHTML = '';
  render(); renderNavbar();
  if (!$('#startScreen').hidden) showStart();
  if (!$('#guideScreen').hidden) openGuide();
  if (!$('#modalScreen').hidden && S.lastResult && $('#modalScreen [data-m="next"]')) renderResult();
  else if (!$('#modalScreen').hidden && S.lastFree && $('#modalScreen [data-m="newfree"]')) showFreeResult(S.lastFree);
}
document.addEventListener('click', function(e){
  var el;
  if ((el = e.target.closest('[data-lang]'))){ setLang(el.getAttribute('data-lang')); return; }
  if ((el = e.target.closest('[data-tb]'))){
    var a = el.getAttribute('data-tb');
    if (a === 'guide') openGuide();
    else if (a === 'home'){ closeModal(); $('#guideScreen').hidden = true; showStart(); }
    else if (a === 'case'){ S.caseOpen = !S.caseOpen; renderCasePanel(); }
    return;
  }
  if ((el = e.target.closest('[data-start]'))){ startCase(el.getAttribute('data-start')); return; }
  if ((el = e.target.closest('[data-g]'))){
    if (el.getAttribute('data-g') === 'close') $('#guideScreen').hidden = true;
    else { fillPrint(); document.body.classList.add('printing'); window.print(); setTimeout(function(){ document.body.classList.remove('printing'); }, 500); }
    return;
  }
  if ((el = e.target.closest('[data-m]'))){
    var m = el.getAttribute('data-m');
    if (m === 'close') closeModal();
    else if (m === 'list'){ closeModal(); go('triage-list'); }
    else if (m === 'copy') copyResult();
    else if (m === 'retry'){ closeModal(); startCase(S.lastResult.cid); }
    else if (m === 'next'){ closeModal(); var i = CASE_ORDER.indexOf(S.lastResult.cid); if (i < CASE_ORDER.length - 1) startCase(CASE_ORDER[i + 1]); else showStart(); }
    else if (m === 'newfree'){ closeModal(); S.d = newData(); S.step = 1; S.editing = null; go('triage-new'); }
    return;
  }
  if (isPhone() && e.target.closest('#casePanel .cp-head') && !e.target.closest('[data-cp]')){ S.caseOpen = false; renderCasePanel(); return; }
  if ((el = e.target.closest('[data-cp]'))){
    var c = el.getAttribute('data-cp');
    if (c === 'close'){ S.caseOpen = false; renderCasePanel(); }
    else if (c === 'open'){ S.caseOpen = true; renderCasePanel(); if (isPhone() && S.view === 'triage-new' && (S.step === 3 || S.step === 4 || (S.caseId === 'T04' && S.step < 5))) cpToMeasures(); }
    else if (c === 'hint') showHint();
    else if (c === 'restart') startCase(S.caseId || 'free');
    return;
  }
  if ((el = e.target.closest('[data-nb]'))){
    var n = el.getAttribute('data-nb');
    if (n === 'burger') document.body.classList.toggle('menu-open');
    else if (n === 'avatar'){ var mm = $('#avMenu'); mm.hidden = !mm.hidden; }
    else if (n === 'logout'){ $('#avMenu').hidden = true; S.d = newData(); S.step = 1; S.editing = null; closeModal(); showStart(t('loggedOut')); }
    else { var am = $('#avMenu'); if (am) am.hidden = true; toast(t('notIncluded'), 't-train'); }
    return;
  }
  if ((el = e.target.closest('[data-nav]'))){
    var v = el.getAttribute('data-nav');
    if (v.indexOf('triage') === 0 || v === 'accueil-enr'){ go(v); }
    else { document.body.classList.remove('menu-open'); toast(v === 'accueil-enr' ? t('notIncludedReg') : t('notIncluded'), 't-train'); }
    return;
  }
  if ((el = e.target.closest('[data-step]'))){
    var st = +el.getAttribute('data-step');
    if (st > 1 && !S.d.patient){ toast(t('choosePatient'), 't-train'); return; }
    stepGo(st); return;
  }
  if ((el = e.target.closest('[data-act]'))){
    var act = el.getAttribute('data-act'), code = el.getAttribute('data-code');
    if (act === 'next'){ if (S.step === 1 && !S.d.patient){ toast(t('choosePatient'), 't-train'); return; } stepGo(Math.min(5, S.step + 1)); }
    else if (act === 'prev'){ stepGo(Math.max(1, S.step - 1)); }
    else if (act === 'submit') finish('submitted');
    else if (act === 'hold') finish('pending');
    else if (act === 'help') showHint();
    else if (act === 'resume') resume(code);
    else if (act === 'detail'){ S.detailCode = code; go('triage-detail'); }
    else if (act === 'consult' || act === 'na') toast(t('notIncluded'), 't-train');
    else if (act === 'new'){ S.d = newData(); S.step = 1; S.editing = null; go('triage-new'); }
    else if (act === 'hist'){ var hb = document.getElementById('hb_' + code); if (hb) hb.hidden = !hb.hidden; }
    else if (act === 'filter'){ S.filter.from = $('#fFrom').value; S.filter.to = $('#fTo').value; S.filter.pending = $('#fPend').checked; refreshTable(); }
    else if (act === 'freset'){ S.filter = {from:ymd(addDays(TODAY, -30)), to:ymd(TODAY), pending:false, q:'', n:10}; render(); }
    else if (act === 'newpatient'){ S.reg = newReg(); go('accueil-enr'); setTimeout(function(){ var f = $('#r_nom'); if (f) f.focus(); }, 0); }
    else if (act === 'regsave') saveReg();
    else if (act === 'regnew' || act === 'regclear'){ S.reg = newReg(); render(); }
    else if (act === 'regtriage'){ S.d = newData(); S.d.patient = code; S.step = 1; S.editing = null; go('triage-new'); }
    return;
  }
  var av = $('#avMenu'); if (av && !av.hidden && !e.target.closest('#avMenu')) av.hidden = true;
  var gd = $('#gdrop'); if (gd && !gd.hidden && !e.target.closest('.nb-search')) gd.hidden = true;
  if (document.body.classList.contains('menu-open') && !e.target.closest('#menu')) document.body.classList.remove('menu-open');
});
document.addEventListener('input', function(e){
  var f = e.target.getAttribute && e.target.getAttribute('data-f');
  if (f){ S.d[f] = e.target.value; if (S.step === 3) updateCalc(); return; }
  var rk = e.target.getAttribute && e.target.getAttribute('data-r');
  if (rk){ (S.reg || (S.reg = newReg()))[rk] = e.target.value; return; }
  if (e.target.id === 'fQ'){ S.filter.q = e.target.value; refreshTable(); return; }
  if (e.target.id === 'gsearch'){
    var q = norm(e.target.value.trim()), gd = $('#gdrop');
    if (q.length < 3){ gd.innerHTML = q.length ? '<div class="msg">Please enter 3 or more characters</div>' : ''; gd.hidden = !q.length; return; }
    var res = PATIENTS.filter(function(p){ return norm(p.id + ' ' + p.name).indexOf(q) >= 0; });
    gd.innerHTML = res.length ? res.map(function(p){ return '<div data-gp="' + p.id + '">' + p.id + ' - ' + esc(p.name) + ' · ' + dmyISO(p.dob) + '</div>'; }).join('') : '<div class="msg">No results found</div>';
    gd.hidden = false;
  }
});
document.addEventListener('mousedown', function(e){ if (e.target.closest('[data-gp]')){ e.preventDefault(); $('#gdrop').hidden = true; $('#gsearch').value = ''; toast(t('notPatientFile'), 't-train'); } });
document.addEventListener('change', function(e){
  var ev = e.target.getAttribute && e.target.getAttribute('data-evda');
  if (ev){ var arr = S.d.evda.filter(function(x){ return x !== ev; }); if (e.target.checked) arr.push(ev); S.d.evda = EVDA.map(function(x){ return x[0]; }).filter(function(k){ return arr.indexOf(k) >= 0; }); return; }
  if (e.target.id === 'fN'){ S.filter.n = +e.target.value; refreshTable(); }
  if (e.target.id === 'learnerName'){ S.learner = e.target.value.trim(); store.set('learner', S.learner); }
});
document.addEventListener('keydown', function(e){
  if ((e.ctrlKey || e.metaKey) && e.key === '/'){ var g = $('#gsearch'); if (g && $('#startScreen').hidden){ e.preventDefault(); g.focus(); } }
  if (e.key === 'Escape'){
    if (!$('#modalScreen').hidden){ closeModal(); return; }
    if (!$('#guideScreen').hidden){ $('#guideScreen').hidden = true; return; }
  }
  if (e.key === 'Enter' && e.target.id === 'learnerName'){ e.preventDefault(); readName(); }
  if (e.key === 'Enter' && e.target.getAttribute && e.target.getAttribute('data-r')){ e.preventDefault(); saveReg(); }
});
$('#modalScreen').addEventListener('mousedown', function(e){ if (e.target.id === 'modalScreen') closeModal(); });
window.addEventListener('resize', function(){ setTbh(); setCpb(); });
function typeable(el){
  if (!el || !el.tagName || el.readOnly) return false;
  if (el.tagName === 'TEXTAREA') return true;
  return el.tagName === 'INPUT' && ['text','search','tel','number','email','password','url'].indexOf((el.getAttribute('type') || 'text').toLowerCase()) >= 0;
}
document.addEventListener('focusin', function(e){ if (isPhone() && typeable(e.target)) document.body.classList.add('kb'); });
document.addEventListener('focusout', function(){ setTimeout(function(){ if (!typeable(document.activeElement) && document.body.classList.contains('kb')){ document.body.classList.remove('kb'); setCpb(); } }, 150); });

/* ---------- hors connexion (site web seulement : le fichier ouvert tel quel ne change pas) ---------- */
var WEB = /^https?:$/.test(location.protocol);
/* calculés seulement pour une adresse internet : sur about:blank, data: ou blob: (fichier ouvert par une autre application), new URL('./', …) échouerait */
var HOME_URL = WEB ? new URL('./', location.href).href : '';
var CACHE_PREFIX = WEB ? 'exercice-triage:' + new URL(HOME_URL).pathname + ':' : '';   /* même nom que dans sw.js */
var LEGACY_CACHE = 'exercice-triage-v1';   /* nom du premier envoi (29/10/2026) : l'ancien service worker sert encore depuis cette copie */
function standalone(){ return !!((window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone); }
function offNoteHTML(){
  if (S.offline === 'no') return esc(t('offNo'));
  return esc(S.offline === 'ready' ? t('offReady') : t('offFirst')) + (standalone() ? '' : ' ' + esc(t('offHome')));
}
function setOffline(v){ S.offline = v; var n = $('#offNote'); if (n) n.innerHTML = offNoteHTML(); }
function headLink(rel, href){ var l = document.createElement('link'); l.rel = rel; l.href = href; document.head.appendChild(l); }
/* demander au navigateur de ne pas effacer la copie quand l'appareil manque de place (Chrome, Safari : sans question ; Firefox poserait une question, donc pas pour lui) */
function keepCopy(){
  try {
    if (navigator.storage && navigator.storage.persist && !/Firefox/.test(navigator.userAgent))
      navigator.storage.persisted().then(function(p){ return p || navigator.storage.persist(); }).catch(function(){});
  } catch (e) {}
}
function checkOffline(){
  if (!window.caches || !caches.keys) return setOffline('no');
  caches.keys().then(function(keys){
    var k = keys.filter(function(x){ return x.indexOf(CACHE_PREFIX) === 0 || x === LEGACY_CACHE; });
    return Promise.all(k.map(function(n){ return caches.open(n).then(function(c){ return c.match(HOME_URL); }); }));
  }).then(function(rs){
    var r = rs.some(function(x){ return !!x; });
    setOffline(r ? 'ready' : 'wait'); if (r) keepCopy();
  }).catch(function(){});
}
var swTries = 0;
function registerSW(again){
  navigator.serviceWorker.register('sw.js').then(function(reg){
    if (again && reg && reg.update){ try { var u = reg.update(); if (u && u.catch) u.catch(function(){}); } catch (e) {} }
    return navigator.serviceWorker.ready;
  }).then(checkOffline)
    .catch(function(err){ if (err && err.name === 'SecurityError') setOffline('no'); });   /* une coupure réseau n'est pas un refus du navigateur */
}
/* copie pas encore faite (réseau coupé pendant l'enregistrement) : réessayer, 3 fois au plus, toutes les 15 s et au retour du réseau */
function retrySW(){ if (S.offline === 'wait' && swTries < 3){ swTries++; registerSW(true); } }
if (WEB){
  headLink('manifest', 'manifest.webmanifest');
  headLink('apple-touch-icon', 'apple-touch-icon.png');
  if ('serviceWorker' in navigator){
    S.offline = 'wait';
    navigator.serviceWorker.addEventListener('controllerchange', checkOffline);   /* nouvelle version du service worker : la copie vient d'être refaite */
    registerSW(false);
    (function later(){ setTimeout(function(){ if (S.offline === 'wait' && swTries < 3){ retrySW(); later(); } }, 15000); })();
    window.addEventListener('online', retrySW);
  } else S.offline = 'no';
}

/* ---------- démarrage ---------- */
document.documentElement.lang = S.lang === 'en' ? 'en' : 'fr';
seed(); renderNavbar(); render(); showStart();
})();
</script>
